{% extends "base.html" %}
{% block title %}Create account — {{ brand.name }}{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <p class="eyebrow">Case Tracker</p>
        <h1>Open your case file</h1>
        <p class="auth-sub">Everything you log stays private to your account.</p>
        <form method="POST" class="stack">
            <label>Full name
                <input type="text" name="full_name" required autofocus>
            </label>
            <label>Email
                <input type="email" name="email" required>
            </label>
            <label>Password
                <input type="password" name="password" required minlength="8">
            </label>
            <button type="submit" class="btn-primary">Create account</button>
        </form>
        <p class="auth-switch">Already have a file? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
