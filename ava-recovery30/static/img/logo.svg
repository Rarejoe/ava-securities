<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avaGrad" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6A8"/>
      <stop offset="45%" stop-color="#D7E85B"/>
      <stop offset="100%" stop-color="#7FA82E"/>
    </linearGradient>
    <filter id="avaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- shield -->
  <path d="M18 2.5 L31.5 7.5 V17.5 C31.5 25.8 25.8 31.9 18 34.5 C10.2 31.9 4.5 25.8 4.5 17.5 V7.5 Z"
        fill="url(#avaGrad)" filter="url(#avaGlow)"/>

  <!-- recovery arrow (circular arrow = restoring access) cut out in dark ink -->
  <path d="M18.5 11.5 A6.5 6.5 0 1 1 12.3 15.2"
        stroke="#12150C" stroke-width="2.1" fill="none" stroke-linecap="round"/>
  <path d="M12 10.8 L12.3 15.2 L16.6 14.4 Z" fill="#12150C"/>
</svg>
